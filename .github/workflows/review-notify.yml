---
name: Review notify

# Posts a team review request to #review-requests in Slack once a PR has the "ready for review" label and
# its CI is green, and reacts to that message when the PR closes. Logic lives in
# themarkerr/reusable-workflows (docs/REVIEW-NOTIFICATIONS.md); this file only supplies the triggers GitHub
# requires in each repo.
on:
  pull_request:
    types: [labeled, closed]

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write # marker comment on the PR (which Slack message belongs to it)
  id-token: write # OpenBao JWT login (a called workflow can only use what the caller grants)

jobs:
  notify:
    uses: themarkerr/reusable-workflows/.github/workflows/review-notify.yml@develop
